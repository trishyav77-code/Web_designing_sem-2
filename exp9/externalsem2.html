<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Even Numbers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
            max-height: 400px;
            border: 1px solid #ccc;
            padding: 20px;
            background-color:bisque;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
        .cal {
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 100px;
        }
        .cal:hover {
            background-color: #45a049;
        }
        </style>
</head>
<body>
    <div class="container">
        <h1>Sum of Even Numbers</h1>
        <p>This program calculates the sum of even numbers from 1 to n.</p>
        <form id="evenSumForm">
            <label for="numberInput">Enter a number:</label>
            <input type="number" id="numberInput" required><br>
            <button type="submit" class="cal">Calculate Sum</button>
        </form>
        <div id="result"></div>
        <script>
            document.getElementById('evenSumForm').addEventListener('submit', function(event) {
                alert("The sum of entered even numbers is being calculated.");
                event.preventDefault();
                const n = parseInt(document.getElementById('numberInput').value);
                let sum = 0;
                for (let i = 1; i <= n; i++) {
                    if (i % 2 === 0) {
                        sum += i;
                    }
                }
                document.getElementById('result').textContent = `The sum of even numbers from 1 to ${n} is: ${sum}`;
            });

        </script>
    
</body>
</html>
